<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Rankings Baseline</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fa;color:#0d1826}
  header{background:linear-gradient(135deg,#002145,#00335f);color:#fff;padding:40px 16px}
  .wrap{max-width:760px;margin:0 auto}

  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a.card{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border:1px solid #dbe3ed;border-radius:10px;padding:16px 18px;text-decoration:none;color:inherit}

  .title{font-weight:700}
  .meta{font-size:14px;color:#46556a}

</head>

<header>

    <h1>Local Rankings Baseline</h1>

  </div>
</header>
<main>
  <div class="wrap">
    <h2>Reports</h2>
    <ul>
      <!-- Add each new month as a new <li> at the top of this list. -->
      <li>
        <a class="card" href="2026-10-05-local-pack-map-rankings.html">
          <span>
            <span class="title">October 2026 Baseline</span><br>
            <span class="meta">Prepared 5 Oct 2026 · 40 locations, 6 clients · BrightLocal</span>
          </span>
          <span class="go">Open →</span>
        </a>

    </ul>
  </div>

</html>
